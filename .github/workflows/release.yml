name: Package early releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

concurrency:
  group: skillhub-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  PNPM_VERSION: 11.21.0

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release source
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release tag input
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release input must be a semantic-version tag such as v0.1.0" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"

      - name: Require updater signing secret
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY secret is required for signed updater artifacts" >&2; exit 1; }
          # Tauri supports unencrypted signing keys; an absent password secret
          # intentionally resolves to an empty value for those keys.
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || { echo "TAURI_UPDATER_PUBLIC_KEY secret/variable is required" >&2; exit 1; }
          configured_key="$(node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json","utf8")); process.stdout.write(c.plugins.updater.pubkey)')"
          test "$configured_key" = "$TAURI_UPDATER_PUBLIC_KEY" || { echo "Committed updater public key does not match TAURI_UPDATER_PUBLIC_KEY" >&2; exit 1; }
          test "$configured_key" != "RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3" || { echo "Test updater public key cannot be used for a release" >&2; exit 1; }

      - name: Install Rust toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check Rust formatting and policy
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo install cargo-deny --locked
          cargo deny check advisories bans licenses sources

      - name: Test Rust workspace
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace

      - name: Install locked frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate frontend
        shell: bash
        run: |
          pnpm audit --prod
          pnpm check:frontend
          pnpm test:frontend
          pnpm --dir apps/desktop build

      - name: Generate release SBOM
        shell: bash
        run: |
          node scripts/generate_sbom.mjs --out-dir artifacts/sbom
          git rev-parse HEAD > artifacts/release-commit.txt
          printf 'tag=%s\ncommit=%s\ntrust=unsigned-windows;adhoc-unnotarized-macos\n' \
            "$RELEASE_TAG" "$(git rev-parse HEAD)" > artifacts/release-metadata.txt

      - name: Upload source metadata and SBOM
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: release-metadata
          path: artifacts
          if-no-files-found: error

  windows:
    name: Windows NSIS (${{ matrix.target }})
    needs: preflight
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install locked frontend dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@${env:PNPM_VERSION} --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build current-user NSIS installer
        shell: pwsh
        run: pnpm --dir apps/desktop tauri build --target ${{ matrix.target }} --config src-tauri/tauri.windows.conf.json

      - name: Collect Windows installer and checksum
        shell: pwsh
        run: |
          $source = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $source) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $name = "SkillHub-${{ matrix.target }}.exe"
          Copy-Item $source.FullName "artifacts/$name"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii artifacts/SHA256SUMS-${{ matrix.target }}.txt
          $updater = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip" | Select-Object -First 1
          if (-not $updater) { throw "Signed NSIS updater archive was not produced" }
          Copy-Item $updater.FullName "artifacts/SkillHub-${{ matrix.target }}.nsis.zip"
          $signature = "{0}.sig" -f $updater.FullName
          if (-not (Test-Path $signature)) { throw "NSIS updater signature was not produced" }
          Copy-Item $signature "artifacts/SkillHub-${{ matrix.target }}.nsis.zip.sig"
          "tag=$env:RELEASE_TAG`ncommit=$(git rev-parse HEAD)`nplatform=windows`ntarget=${{ matrix.target }}`ntrust=tauri-updater-signed;installer-unsigned" | Set-Content -Encoding ascii artifacts/release-metadata-${{ matrix.target }}.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: windows-${{ matrix.target }}
          path: artifacts
          if-no-files-found: error

  macos:
    name: macOS Universal DMG
    needs: preflight
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install Rust targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install locked frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build ad-hoc Universal DMG
        shell: bash
        run: pnpm --dir apps/desktop tauri build --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json

      - name: Collect macOS DMG and checksum
        shell: bash
        run: |
          set -euo pipefail
          source_file="$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$source_file"
          mkdir -p artifacts
          cp "$source_file" artifacts/SkillHub-macos-universal.dmg
          shasum -a 256 artifacts/SkillHub-macos-universal.dmg > artifacts/SHA256SUMS-macos-universal.txt
          updater_file="$(find target/universal-apple-darwin/release/bundle -maxdepth 2 -name '*.app.tar.gz' -print -quit)"
          test -n "$updater_file"
          test -f "${updater_file}.sig"
          cp "$updater_file" artifacts/SkillHub-macos-universal.app.tar.gz
          cp "${updater_file}.sig" artifacts/SkillHub-macos-universal.app.tar.gz.sig
          printf 'tag=%s\ncommit=%s\nplatform=macos\ntarget=universal-apple-darwin\ntrust=adhoc-unnotarized\n' \
            "$RELEASE_TAG" "$(git rev-parse HEAD)" > artifacts/release-metadata-macos-universal.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: macos-universal
          path: artifacts
          if-no-files-found: error

  draft-release:
    name: Create draft GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Separate release evidence from public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          find artifacts -maxdepth 1 -type f \
            \( -name 'SHA256SUMS-*' -o -name 'release-*.txt' -o -name '*.cdx.json' -o -name '*-unsigned.md' \) \
            -exec mv {} release-evidence/ \;
          if [ -d artifacts/sbom ]; then
            mv artifacts/sbom release-evidence/sbom
          fi
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" > release-evidence/release-provenance.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: release-evidence-${{ env.RELEASE_TAG }}
          path: release-evidence
          if-no-files-found: error

      - name: Generate signed updater manifest
        shell: bash
        env:
          SKILLHUB_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
          SKILLHUB_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SKILLHUB_RELEASE_NOTES_FILE: docs/release-process.md
        run: |
          version="${RELEASE_TAG#v}"
          SKILLHUB_RELEASE_VERSION="$version" node scripts/generate_update_manifest.mjs artifacts artifacts/latest.json

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find artifacts -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were collected" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --title "SkillHub $RELEASE_TAG" \
              --notes-file docs/release-process.md
          fi
