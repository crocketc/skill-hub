## Permission Table

[[permission]]
identifier = "allow-execute-command"
description = "Allows the typed AppCommand envelope to reach the injected application facade."
commands.allow = ["execute_command"]

[[permission]]
identifier = "deny-execute-command"
description = "Denies the typed AppCommand envelope."
commands.deny = ["execute_command"]

[[permission]]
identifier = "allow-query-application"
description = "Allows the typed AppQuery envelope to reach the injected application facade."
commands.allow = ["query_application"]

[[permission]]
identifier = "deny-query-application"
description = "Denies the typed AppQuery envelope."
commands.deny = ["query_application"]

[[permission]]
identifier = "allow-pick-local-directory"
description = "Allows the desktop shell to open a native local directory picker."
commands.allow = ["pick_local_directory"]

[[permission]]
identifier = "deny-pick-local-directory"
description = "Denies the native local directory picker."
commands.deny = ["pick_local_directory"]
