[package]
name = "skillhub-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
skillhub-core = { path = "../skillhub-core" }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
