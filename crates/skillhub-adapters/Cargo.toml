[package]
name = "skillhub-adapters"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
skillhub-core = { path = "../skillhub-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
gix = { version = "0.87", default-features = false, features = ["basic", "sha1", "blocking-http-transport-reqwest-rust-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
url = "2"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]

[[test]]
name = "profile_contract"
path = "../../tests/compatibility/profile_contract.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
