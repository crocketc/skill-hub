[package]
name = "skillhub-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
specta = { version = "2.0.0-rc.25", features = ["derive", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
