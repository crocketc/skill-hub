[package]
name = "skillhub-storage"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
async-trait = "0.1"
skillhub-core = { path = "../skillhub-core", version = "0.1.0" }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
skillhub-testkit = { path = "../skillhub-testkit", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
